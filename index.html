<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Console</title>
  <style>
    :root{
      --bg1:#050805;
      --bg2:#0b130b;
      --bg3:#151b12;
      --olive:#5d6532;
      --olive2:#7a8450;
      --line:#9aa37a;
      --text:#eef3e5;
      --muted:#b7c1a5;
      --panel:rgba(9, 14, 10, 0.72);
      --shadow:rgba(0,0,0,0.55);
    }

    *{ box-sizing:border-box; }
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:"Courier New", monospace;
      color:var(--text);
      background:
        radial-gradient(circle at center, rgba(93,101,50,0.22) 0%, rgba(93,101,50,0.08) 18%, transparent 40%),
        radial-gradient(circle at 20% 30%, rgba(122,132,80,0.20) 0%, transparent 28%),
        radial-gradient(circle at 80% 25%, rgba(122,132,80,0.16) 0%, transparent 24%),
        radial-gradient(circle at 65% 78%, rgba(70,78,42,0.18) 0%, transparent 30%),
        linear-gradient(180deg, var(--bg3), var(--bg2) 35%, var(--bg1) 100%);
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity:0.18;
      pointer-events:none;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.45) 100%);
      pointer-events:none;
    }

    .wrap{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .panel{
      width:min(620px, 92vw);
      border:1px solid rgba(154,163,122,0.8);
      background:var(--panel);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 18px 60px var(--shadow),
        inset 0 0 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(3px);
      padding:28px 28px 24px;
      position:relative;
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:10px;
      border:1px solid rgba(154,163,122,0.16);
      pointer-events:none;
    }

    .title{
      text-align:center;
      font-size:22px;
      letter-spacing:3px;
      color:#f4f7ef;
      text-shadow:0 0 12px rgba(122,132,80,0.2);
      margin-bottom:20px;
      padding-bottom:12px;
      border-bottom:1px solid rgba(154,163,122,0.35);
    }

    .mic-btn{
      width:92px;
      height:92px;
      margin:18px auto 10px;
      border-radius:50%;
      border:2px solid #c8d2b4;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      color:#f9fdf5;
      font-weight:bold;
      letter-spacing:2px;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(93,101,50,0.92) 45%, rgba(33,39,18,0.98) 100%);
      box-shadow:
        0 0 0 6px rgba(93,101,50,0.08),
        0 0 24px rgba(122,132,80,0.22),
        inset 0 0 16px rgba(255,255,255,0.06);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .mic-btn:hover{ transform:scale(1.04); }
    .mic-btn.active{
      border-color:#ff6b6b;
      box-shadow:
        0 0 0 6px rgba(255,107,107,0.10),
        0 0 28px rgba(255,107,107,0.20),
        inset 0 0 16px rgba(255,255,255,0.06);
      animation:pulse 1s infinite;
    }

    @keyframes pulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.08); }
    }

    .status{
      text-align:center;
      margin-top:8px;
      font-size:14px;
      color:var(--muted);
      letter-spacing:3px;
      text-transform:uppercase;
    }

    .output{
      margin-top:22px;
      border:1px solid rgba(154,163,122,0.5);
      background:rgba(4, 8, 5, 0.72);
      min-height:150px;
      padding:14px 16px;
    }

    .label{
      font-size:12px;
      color:#d7e4c0;
      letter-spacing:2px;
      margin-bottom:8px;
      text-transform:uppercase;
    }

    #result{
      color:#eef3e5;
      font-size:16px;
      line-height:1.7;
      white-space:pre-wrap;
      min-height:90px;
    }

    .foot{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      font-size:11px;
      letter-spacing:2px;
      color:#aab496;
      text-transform:uppercase;
      border-top:1px solid rgba(154,163,122,0.25);
      padding-top:10px;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#9ad18b;
      display:inline-block;
      margin-right:8px;
      box-shadow:0 0 10px rgba(154,209,139,0.8);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="title">COMMAND INPUT TERMINAL</div>

      <div class="mic-btn" id="mic">MIC</div>
      <div class="status" id="status">IDLE</div>

      <div class="output">
        <div class="label">OUTPUT</div>
        <div id="result">--</div>
      </div>

      <div class="foot">
        <div><span class="dot"></span>secure voice link</div>
        <div>army tactical mode</div>
      </div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    const mic = document.getElementById("mic");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    mic.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstop = async () => {
          mic.classList.remove("active");
          status.innerText = "PROCESSING...";

          const blob = new Blob(audioChunks, { type: "audio/wav" });
          const formData = new FormData();
          formData.append("file", blob, "audio.wav");

          try {
            const res = await fetch("http://127.0.0.1:5000/process-audio", {
              method: "POST",
              body: formData
            });
            const data = await res.json();
            result.innerText = data.output || "No output received.";
            status.innerText = "READY";
          } catch (err) {
            result.innerText = "Error connecting to backend.";
            status.innerText = "OFFLINE";
          }
        };

        mediaRecorder.start();
        mic.classList.add("active");
        status.innerText = "RECORDING...";

        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        }, 3000);

      } catch (err) {
        status.innerText = "MIC ACCESS DENIED";
        result.innerText = "Allow microphone permission to continue.";
      }
    };
  </script>
</body>
</html>
